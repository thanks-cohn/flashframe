name: Build Chrome Web Store submission candidate

on:
  push:
    branches:
      - chrome-web-store-submission-2026-08-24
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-store-candidate:
    runs-on: windows-latest
    steps:
      - name: Check out FrameChute
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem src -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.FullName)" }
          }

      - name: Build exact Chrome Web Store package
        shell: pwsh
        run: ./scripts/package-web-store.ps1

      - name: Verify submission manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content dist/test-unpacked/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3) { throw "Expected Manifest V3" }
          if ([string]$manifest.name -ne "FrameChute") { throw "Expected FrameChute manifest name" }
          if ([string]$manifest.version -ne "1.0.8") { throw "Expected v1.0.8 submission candidate" }
          if (@($manifest.permissions).Count -ne 0) { throw "Submission candidate must request zero API permissions" }
          if (@($manifest.host_permissions).Count -ne 0) { throw "Submission candidate must request zero host permissions" }

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Get-ChildItem dist/flashframe-chrome-web-store-v1.0.8.zip | Select-Object -First 1
          if (-not $zip) { throw "v1.0.8 Store ZIP missing" }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Out-File "$($zip.FullName).sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload exact submission candidate
        uses: actions/upload-artifact@v4
        with:
          name: FrameChute-Chrome-Web-Store-v1.0.8
          path: |
            dist/flashframe-chrome-web-store-v1.0.8.zip
            dist/flashframe-chrome-web-store-v1.0.8.zip.sha256
            dist/test-unpacked/**
            PRIVACY.md
            docs/STORE_LISTING.md
            docs/DASHBOARD_ANSWERS.md
            docs/REVIEWER_NOTES.md
            docs/RELEASE_READINESS.md
            docs/WINDOWS_STORE_TEST.md
            docs/CHROME_WEB_STORE_SUBMISSION_2026-08-24.md
          if-no-files-found: error
          retention-days: 30
