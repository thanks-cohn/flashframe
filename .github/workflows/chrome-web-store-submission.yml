name: Build Chrome Web Store submission candidate

on:
  push:
    branches:
      - chrome-web-store-submission-2026-08-24
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-store-candidate:
    runs-on: windows-latest
    steps:
      - name: Check out FrameChute
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem src -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.FullName)" }
          }

      - name: Build exact Chrome Web Store package
        shell: pwsh
        run: ./scripts/package-web-store.ps1

      - name: Verify submission manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceManifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $manifest = Get-Content dist/test-unpacked/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.manifest_version -ne 3) { throw "Expected Manifest V3" }
          if ([string]$manifest.name -ne "FrameChute") { throw "Expected FrameChute manifest name" }
          if ([string]$manifest.version -ne [string]$sourceManifest.version) {
            throw "Packaged version does not match source manifest"
          }
          if ([string]::IsNullOrWhiteSpace([string]$manifest.version)) {
            throw "Submission candidate version is missing"
          }

          $apiPermissions = @()
          if ($null -ne $manifest.PSObject.Properties["permissions"]) {
            $apiPermissions = @(
              $manifest.permissions |
              ForEach-Object { [string]$_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
          }
          if ($apiPermissions.Count -ne 0) { throw "Submission candidate must request zero API permissions" }

          $hostPermissions = @()
          if ($null -ne $manifest.PSObject.Properties["host_permissions"]) {
            $hostPermissions = @(
              $manifest.host_permissions |
              ForEach-Object { [string]$_ } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
          }
          if ($hostPermissions.Count -ne 0) { throw "Submission candidate must request zero host permissions" }

          Write-Host "Verified FrameChute Store candidate v$($manifest.version)"

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          $zip = Get-ChildItem "dist/flashframe-chrome-web-store-v$version.zip" | Select-Object -First 1
          if (-not $zip) { throw "Store ZIP missing for v$version" }
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Out-File "$($zip.FullName).sha256" -Encoding ascii
          Write-Host "SHA256: $hash"

      - name: Upload exact submission candidate
        uses: actions/upload-artifact@v4
        with:
          name: FrameChute-Chrome-Web-Store-candidate
          path: |
            dist/flashframe-chrome-web-store-v*.zip
            dist/flashframe-chrome-web-store-v*.zip.sha256
            dist/test-unpacked/**
            PRIVACY.md
            docs/STORE_LISTING.md
            docs/DASHBOARD_ANSWERS.md
            docs/REVIEWER_NOTES.md
            docs/RELEASE_READINESS.md
            docs/WINDOWS_STORE_TEST.md
            docs/CHROME_WEB_STORE_SUBMISSION_2026-08-24.md
          if-no-files-found: error
          retention-days: 30
