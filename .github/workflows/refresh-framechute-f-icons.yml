name: Refresh FrameChute ƒ icons

on:
  push:
    paths:
      - .github/workflows/refresh-framechute-f-icons.yml

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write FrameChute icons
        shell: bash
        run: |
          mkdir -p icons
          echo '' | base64 -d > icons/icon16.png
          echo '' | base64 -d > icons/icon32.png
          echo '' | base64 -d > icons/icon48.png
          echo '' | base64 -d > icons/icon128.png
      - name: Commit icons
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png
          if git diff --cached --quiet; then
            echo "Icons already current."
            exit 0
          fi
          git commit -m "Use red ƒ FrameChute extension icon"
          git push
