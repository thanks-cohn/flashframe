name: Publish Recent-Release_8-24

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recent-release-8-24.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out FrameChute
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: find src -name '*.js' -type f -print0 | xargs -0 -n1 node --check

      - name: Build Chrome package
        run: sh scripts/package-web-store.sh

      - name: Prepare release asset
        run: |
          set -eu
          zip_path=$(find dist -maxdepth 1 -type f -name 'flashframe-chrome-web-store-v*.zip' -print -quit)
          test -n "$zip_path"
          cp "$zip_path" "Recent-Release_8-24.zip"
          sha256sum "Recent-Release_8-24.zip" > "Recent-Release_8-24.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # Recent-Release_8-24

          Fresh FrameChute desktop Chromium build from the current `main` branch.

          Includes the August 24 fixes and polish:
          - packaged Grab artwork is the real default
          - media player is pinned to the packaged Default Grab image
          - no broken media-player Grab image after later UI refreshes
          - native file/folder pickers are serialized so slow Windows machines cannot queue several dialogs
          - reduced unnecessary observer work for lower-memory systems
          - FrameChute mascot, media controls, themes, galleries, PDFs, audio, video, URLs, notes, and saved spatial workspaces
          - Manifest V3 Chrome/Chromium package

          No native companion required.
          EOF

          tag="recent-release-8-24"
          title="Recent-Release_8-24"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release-notes.md --latest
            gh release upload "$tag" "Recent-Release_8-24.zip" "Recent-Release_8-24.zip.sha256" --clobber
          else
            gh release create "$tag" \
              "Recent-Release_8-24.zip" \
              "Recent-Release_8-24.zip.sha256" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              --latest
          fi
