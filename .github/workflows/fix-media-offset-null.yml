name: Fix unset media timeline offsets

on:
  push:
    paths:
      - .github/workflows/fix-media-offset-null.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve unset offsets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/workspace.js')
          s = p.read_text()
          old = 'if (Number.isFinite(Number(state.masterTimelineOffset))) restoredPlayer.dataset.masterTimelineOffset = String(Number(state.masterTimelineOffset));'
          new = 'if (state.masterTimelineOffset != null && Number.isFinite(Number(state.masterTimelineOffset))) restoredPlayer.dataset.masterTimelineOffset = String(Number(state.masterTimelineOffset));'
          if old not in s: raise SystemExit('workspace pattern missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/drop-local-sources.js')
          s = p.read_text()
          old = 'if (Number.isFinite(Number(payload.masterTimelineOffset))) player.dataset.masterTimelineOffset = String(Number(payload.masterTimelineOffset));'
          new = 'if (payload.masterTimelineOffset != null && Number.isFinite(Number(payload.masterTimelineOffset))) player.dataset.masterTimelineOffset = String(Number(payload.masterTimelineOffset));'
          if s.count(old) != 2: raise SystemExit(f'expected 2 payload patterns, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
          node --check src/workspace.js
          node --check src/drop-local-sources.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/workspace.js src/drop-local-sources.js
          git commit -m "Keep absent media timeline offsets unset"
          git push
