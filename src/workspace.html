<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashframe</title>
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">Flashframe</div>

    <div class="toolbar-actions" aria-label="Add blocks">
      <button id="add-text" type="button">New note</button>
      <button id="open-text" type="button">Open text</button>
      <button id="open-pdf" type="button">Open PDF</button>
      <button id="open-gallery" type="button">Open gallery</button>
      <button id="open-video" type="button">Open video</button>
    </div>

    <div class="toolbar-actions frame-actions" aria-label="Flashframes">
      <button id="save-frame" type="button">Save Flashframe</button>
      <select id="saved-frames" aria-label="Saved Flashframes">
        <option value="">Saved Flashframes</option>
      </select>
      <button id="restore-frame" type="button">Restore</button>
    </div>

    <button id="settings-toggle" class="settings-toggle" type="button" aria-expanded="false" aria-controls="settings-panel">Settings</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </header>

  <aside id="settings-panel" class="settings-panel" hidden aria-label="Flashframe settings">
    <div class="settings-heading">
      <strong>Settings</strong>
      <button id="settings-close" class="settings-close" type="button" aria-label="Close settings">×</button>
    </div>

    <label class="setting-row">
      <input id="setting-block-headers" type="checkbox" checked>
      <span>
        <strong>Show block headers</strong>
        <small>Hide the title bars on Flashframe blocks.</small>
      </span>
    </label>

    <label class="setting-row">
      <input id="setting-toolbar" type="checkbox" checked>
      <span>
        <strong>Show top toolbar</strong>
        <small>When hidden, use the movable Flashframe button to bring it back.</small>
      </span>
    </label>

    <label class="setting-row">
      <input id="setting-loop-videos" type="checkbox">
      <span>
        <strong>Loop all videos automatically</strong>
        <small>Individual videos can still turn looping off.</small>
      </span>
    </label>
  </aside>

  <button id="toolbar-summon" class="toolbar-summon" type="button" title="Show or hide Flashframe controls" aria-label="Show or hide Flashframe controls">F</button>

  <main id="workspace" class="workspace" aria-label="Flashframe workspace"></main>

  <template id="text-block-template">
    <section class="block text-block" data-block-type="text">
      <div class="block-header">
        <input class="block-name" value="Untitled" aria-label="Block name">
        <span class="source-badge" hidden></span>
        <div class="block-actions">
          <button class="maximize-block" type="button" title="Maximize">□</button>
          <button class="remove-block" type="button" title="Remove from workspace">×</button>
        </div>
      </div>
      <textarea class="text-editor" spellcheck="true" aria-label="Text"></textarea>
    </section>
  </template>

  <template id="pdf-block-template">
    <section class="block pdf-block" data-block-type="pdf">
      <div class="block-header">
        <input class="block-name" value="PDF" aria-label="Block name">
        <div class="block-actions">
          <button class="maximize-block" type="button" title="Maximize">□</button>
          <button class="remove-block" type="button" title="Remove from workspace">×</button>
        </div>
      </div>
      <div class="block-toolbar pdf-toolbar">
        <button class="pdf-prev" type="button" title="Previous page">‹</button>
        <label>Page <input class="pdf-page" type="number" min="1" step="1" value="1" inputmode="numeric"></label>
        <button class="pdf-next" type="button" title="Next page">›</button>
        <button class="reconnect-source" type="button" hidden>Reconnect</button>
      </div>
      <div class="source-message" hidden></div>
      <iframe class="pdf-viewer" title="PDF viewer"></iframe>
    </section>
  </template>

  <template id="gallery-block-template">
    <section class="block gallery-block" data-block-type="gallery">
      <div class="block-header">
        <input class="block-name" value="Gallery" aria-label="Block name">
        <div class="block-actions">
          <button class="maximize-block" type="button" title="Maximize">□</button>
          <button class="remove-block" type="button" title="Remove from workspace">×</button>
        </div>
      </div>
      <div class="gallery-stage">
        <img class="gallery-image" alt="">
        <div class="source-message" hidden></div>
      </div>
      <div class="block-toolbar gallery-toolbar">
        <button class="gallery-prev" type="button" title="Previous image">‹</button>
        <span class="gallery-position">0 / 0</span>
        <span class="gallery-filename"></span>
        <button class="gallery-next" type="button" title="Next image">›</button>
        <button class="reconnect-source" type="button" hidden>Reconnect</button>
      </div>
    </section>
  </template>

  <template id="video-block-template">
    <section class="block video-block" data-block-type="video">
      <div class="block-header">
        <input class="block-name" value="Video" aria-label="Block name">
        <div class="block-actions">
          <button class="maximize-block" type="button" title="Maximize">□</button>
          <button class="remove-block" type="button" title="Remove from workspace">×</button>
        </div>
      </div>
      <div class="source-message" hidden></div>
      <video class="video-player" controls preload="metadata"></video>
      <div class="block-toolbar source-toolbar">
        <span class="video-time">0:00</span>
        <label class="video-loop-control" title="Override the global loop setting for this video">
          <input class="video-loop" type="checkbox">
          <span>Loop</span>
        </label>
        <button class="reconnect-source" type="button" hidden>Reconnect</button>
      </div>
    </section>
  </template>

  <script type="module" src="workspace.js"></script>
  <script type="module" src="settings.js"></script>
</body>
</html>
