<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flashframe</title>
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="floating.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">Flashframe</div>

    <div class="toolbar-actions" aria-label="Add blocks">
      <button id="add-text" type="button">New note</button>
      <button id="open-text" type="button">Open text</button>
      <button id="open-pdf" type="button">Open PDF</button>
      <button id="open-gallery" type="button">Open gallery</button>
      <button id="open-video" type="button">Open video</button>
      <button id="open-url" type="button">Open URL</button>
    </div>

    <div class="toolbar-actions frame-actions" aria-label="Flashframes">
      <button id="save-frame" type="button">Save Flashframe</button>
      <select id="saved-frames" aria-label="Saved Flashframes">
        <option value="">Saved Flashframes</option>
      </select>
      <button id="restore-frame" type="button">Restore</button>
      <button id="reconnect-all" type="button">Reconnect all</button>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </header>

  <button id="toolbar-summon" class="toolbar-summon" type="button" title="Show or hide Flashframe controls" aria-label="Show or hide Flashframe controls">F</button>

  <aside id="settings-dock" class="floating-dock settings-dock" aria-label="Flashframe settings">
    <div class="dock-head settings-head">
      <button id="settings-dock-grip" class="dock-drag" type="button" title="Drag settings" aria-label="Drag settings"><span class="spinner-mark" aria-hidden="true">✣</span></button>
      <button id="settings-mini" class="settings-mini" type="button" title="Settings" aria-label="Settings">⚙</button>
      <strong class="dock-title">Settings</strong>
      <button id="settings-expand" class="dock-expand" type="button" title="Minimize settings" aria-label="Minimize settings">−</button>
    </div>
    <div class="dock-body settings-body">
      <label class="setting-row">
        <input id="setting-block-headers" type="checkbox" checked>
        <span><strong>Show block headers</strong><small>Hide the title bars on Flashframe blocks.</small></span>
      </label>
      <label class="setting-row">
        <input id="setting-toolbar" type="checkbox" checked>
        <span><strong>Show top toolbar</strong><small>When hidden, use the movable F button to bring it back.</small></span>
      </label>
      <label class="setting-row">
        <input id="setting-loop-videos" type="checkbox">
        <span><strong>Loop local videos by default</strong><small>Individual local videos can still turn looping off.</small></span>
      </label>
      <label class="setting-row">
        <input id="setting-fade-settings" type="checkbox">
        <span><strong>Fade Settings sticky</strong><small>Fade after the configured delay. Hover its area to bring it back.</small></span>
      </label>
      <label class="setting-row">
        <input id="setting-fade-player" type="checkbox">
        <span><strong>Fade Player sticky</strong><small>Fade after the configured delay. Hover its area to bring it back.</small></span>
      </label>

      <label class="setting-choice-row">
        <span><strong>Fade delay</strong><small>Default: 10 seconds.</small></span>
        <span class="setting-inline-input"><input id="setting-fade-delay" type="number" min="1" max="300" step="1" value="10" inputmode="numeric"><span>seconds</span></span>
      </label>

      <label class="setting-choice-row">
        <span><strong>Video footer</strong><small>Controls below each local video block.</small></span>
        <select id="setting-video-footer" aria-label="Video footer behavior">
          <option value="show">Always show</option>
          <option value="fade">Fade until hover</option>
          <option value="hide">Hide</option>
        </select>
      </label>

      <label class="setting-choice-row">
        <span><strong>Other block controls</strong><small>PDF, gallery, image, and web control bars.</small></span>
        <select id="setting-other-footers" aria-label="Other block control behavior">
          <option value="show">Always show</option>
          <option value="fade">Fade until hover</option>
          <option value="hide">Hide</option>
        </select>
      </label>

      <div class="storage-setting">
        <div><strong>Flashframe data folder</strong><small>Recommended: <code>~/flashframe</code>. Saved sessions live here independently of the extension code.</small></div>
        <div id="archive-status" class="archive-status">Not connected</div>
        <button id="archive-connect" type="button">Choose ~/flashframe</button>
      </div>
    </div>
  </aside>

  <aside id="video-dock" class="floating-dock video-dock" aria-label="All video controls">
    <div class="player-head">
      <button id="video-dock-grip" class="dock-drag" type="button" title="Drag player" aria-label="Drag player"><span class="spinner-mark" aria-hidden="true">✣</span></button>
      <div class="player-middle" aria-label="Global video controls">
        <select id="media-scope" aria-label="Timed media scope"><option value="all">All media</option></select>
        <button id="video-rewind-all" class="player-control" type="button" title="Rewind timed media">↶</button>
        <button id="video-play-all" class="player-control player-play" type="button" title="Play or pause timed media">▶</button>
        <button id="video-forward-all" class="player-control" type="button" title="Forward timed media">↷</button>
      </div>
      <button id="video-expand" class="dock-expand" type="button" title="Minimize player" aria-label="Minimize player">−</button>
    </div>
    <div class="dock-body video-dock-body">
      <label class="rewind-amount"><span>Step</span><input id="video-rewind-seconds" type="number" min="0.1" max="3600" step="0.1" value="10" inputmode="decimal"><span>seconds</span></label>
      <small>Controls eligible local and direct-URL timed media together.</small>
    </div>
  </aside>

  <main id="workspace" class="workspace" aria-label="Flashframe workspace"></main>

  <template id="text-block-template"><section class="block text-block" data-block-type="text"><div class="block-header"><input class="block-name" value="Untitled" aria-label="Block name"><span class="source-badge" hidden></span><div class="block-actions"><button class="maximize-block" type="button" title="Maximize">□</button><button class="remove-block" type="button" title="Remove from workspace">×</button></div></div><textarea class="text-editor" spellcheck="true" aria-label="Text"></textarea></section></template>

  <template id="pdf-block-template"><section class="block pdf-block" data-block-type="pdf"><div class="block-header"><input class="block-name" value="PDF" aria-label="Block name"><div class="block-actions"><button class="maximize-block" type="button" title="Maximize">□</button><button class="remove-block" type="button" title="Remove from workspace">×</button></div></div><div class="block-toolbar pdf-toolbar"><button class="pdf-prev" type="button" title="Previous page">‹</button><label>Page <input class="pdf-page" type="number" min="1" step="1" value="1" inputmode="numeric"></label><button class="pdf-next" type="button" title="Next page">›</button><button class="reconnect-source" type="button" hidden>Reconnect</button></div><div class="source-message" hidden></div><iframe class="pdf-viewer" title="PDF viewer"></iframe></section></template>

  <template id="gallery-block-template"><section class="block gallery-block" data-block-type="gallery"><div class="block-header"><input class="block-name" value="Gallery" aria-label="Block name"><div class="block-actions"><button class="maximize-block" type="button" title="Maximize">□</button><button class="remove-block" type="button" title="Remove from workspace">×</button></div></div><div class="gallery-stage"><img class="gallery-image" alt=""><div class="source-message" hidden></div></div><div class="block-toolbar gallery-toolbar"><button class="gallery-prev" type="button" title="Previous image">‹</button><span class="gallery-position">0 / 0</span><span class="gallery-filename"></span><button class="gallery-next" type="button" title="Next image">›</button><button class="reconnect-source" type="button" hidden>Reconnect</button></div></section></template>

  <template id="video-block-template"><section class="block video-block" data-block-type="video"><div class="block-header"><input class="block-name" value="Video" aria-label="Block name"><div class="block-actions"><button class="maximize-block" type="button" title="Maximize">□</button><button class="remove-block" type="button" title="Remove from workspace">×</button></div></div><div class="source-message" hidden></div><video class="video-player" controls preload="metadata"></video><div class="block-toolbar source-toolbar"><span class="video-time">0:00</span><label class="video-loop-control" title="Override the global loop setting for this video"><input class="video-loop" type="checkbox"><span>Loop</span></label><button class="reconnect-source" type="button" hidden>Reconnect</button></div></section></template>

  <template id="web-block-template">
    <section class="block web-block" data-block-type="web">
      <div class="block-header"><input class="block-name" value="Web page" aria-label="Block name"><div class="block-actions"><button class="maximize-block" type="button" title="Maximize">□</button><button class="remove-block" type="button" title="Remove from workspace">×</button></div></div>
      <iframe class="web-frame" title="Web page"></iframe>
      <div class="block-toolbar web-toolbar"><span class="url-host"></span><span class="embed-note">Some sites block embedding.</span><button class="reload-web" type="button">Reload</button><button class="open-external" type="button">Open page</button></div>
    </section>
  </template>

  <script type="module" src="workspace.js"></script>
  <script type="module" src="controls.js"></script>
  <script type="module" src="workspace-extras.js"></script>
  <script type="module" src="dock-fade.js"></script>
  <script type="module" src="footer-visibility.js"></script>
  <script type="module" src="reconnect-all.js"></script>
  <script type="module" src="media-sync.js"></script>
  <script type="module" src="archive-bridge.js"></script>
</body>
</html>
